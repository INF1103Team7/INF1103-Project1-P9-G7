
name: IO Manager CI

on:
  push:
    paths:
      - "io*/**"
      - "io_manager.py"
      - "tests/test_io_manager.py"
      - "requirements.txt"
      - '.github/workflows/io_manager_ci.yml'

  pull_request:
    paths:
      - "io*/**"
      - "io_manager.py"
      - "tests/test_io_manager.py"
      - "requirements.txt"
      - '.github/workflows/io_manager_ci.yml'

jobs:
  test-io-layer:
    runs-on: ubuntu-latest

    steps:
      # Download repo code#
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python environment and install dependencies#
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run IO Manager tests
        env:
          APP_CONTAINER: "1"
        run: |
          python -m pytest tests/test_io_manager.py -v --cov=io_classes --cov=io_manager --cov-report=term-missing
